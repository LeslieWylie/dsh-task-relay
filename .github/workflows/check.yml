name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run typecheck
      - run: npm test

      # `lib/` is committed on purpose: pnpm refuses to run build scripts for a
      # git dependency by default, so a package whose entry point only exists
      # after `tsc` is uninstallable from GitHub. Committing the build buys
      # installability and costs freshness — this is what pays that cost back.
      - name: committed lib/ matches src/
        run: |
          npm run build
          if [ -n "$(git status --porcelain lib/)" ]; then
            echo "::error::lib/ is stale. Run 'npm run build' and commit the result."
            git --no-pager diff --stat lib/
            exit 1
          fi

      # Executes the published entry point through a real cordis registry.
      # This only runs on a public runner because the harness packages are
      # devDependencies here as well as peers. They have to be devDeps: the
      # typecheck and this boot step both resolve `@deepseek-ai/cordis` out of
      # this repository's own node_modules, and a consumer's install is no help
      # to that.
      #
      # Note `@deepseek-ai/dsh-tools`'s npm `latest` tag is 0.0.1-rc.1, which is
      # older than the `next` tag (0.1.0-rc.6) that shipping harnesses run. The
      # devDeps pin the version users actually have.
      - run: npm run test:boot

      # A bare install into an empty project — no harness placed there first.
      #
      # This used to be considered impossible on principle: the harness packages
      # are peers, so the reasoning went that a stranger must supply them the way
      # a webpack plugin needs webpack. That was only true because the peers were
      # marked `optional: true`, and npm does not auto-install optional peers.
      # They are not optional — lib/index.js imports lib/tools.js, which imports
      # `@deepseek-ai/dsh-tools` at the top level — so what actually happened was
      # ERR_MODULE_NOT_FOUND on the first import of a freshly installed package,
      # while every test here stayed green.
      #
      # Dropping the flag is also what the official DeepSeek plugins do
      # (dsh-tool-str-replace-editor, dsh-skill-filesystem, dsh-fs-local all
      # declare the harness as required peers), and the duplicate-copy worry it
      # was guarding against was measured and does not occur: installing this
      # package into a tree that already holds the harness leaves exactly one
      # copy of @deepseek-ai/cordis, because npm dedupes a peer that is already
      # satisfied.
      - run: node scripts/check-install.mjs

      # The install path the README promises, exercised as a stranger following
      # it gets it: harness first, then this package.
      #
      # Kept alongside the bare install above because it pins explicit harness
      # versions, and that is what guards the peer *range*. v0.1.0 declared
      # `>=0.0.1-rc.1 <0.2.0`, which by semver's prerelease rule does not match
      # 0.1.0-rc.6 — a prerelease only satisfies a comparator set when some
      # comparator shares its major.minor.patch tuple and carries a prerelease
      # tag. So npm tried to pull 0.0.1-rc.1 alongside and failed with ERESOLVE
      # on every real profile. Hence the explicit `||` across both lines. The
      # bare install cannot catch that regression: left to itself npm resolves
      # the range to 0.0.1-rc.1 and never exercises the 0.1.x half.
      - name: a stranger can install this into a profile
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install @deepseek-ai/cordis@4.0.1 @deepseek-ai/dsh-tools@0.1.0-rc.6 \
            /tmp/dsh-task-relay-*.tgz
          node -e "
            const m = require('node:module').createRequire('/tmp/consumer/');
            import(m.resolve('dsh-task-relay')).then((p) => {
              if (typeof p.apply !== 'function') throw new Error('no apply() export');
              console.log('resolved and loaded:', Object.keys(p).join(', '));
            });
          "
